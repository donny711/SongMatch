workflows:
  ios-production:
    name: SongMatch iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic v2"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.songmatch.app
      node: v22
      xcode: latest
      cocoapods: default
      groups:
        - env_vars

    scripts:
      - name: Create .env file
        script: |
          # Only vars the release build actually needs. EXPO_PUBLIC_* values are
          # inlined into the JS bundle and extractable from the IPA, so:
          # no Last.fm key (prod uses the worker proxy, which injects it),
          # no AudD token (its worker holds it), no SoundCloud secret (feature
          # gated), no dead AdMob/RevenueCat keys. Never cat this file — it
          # would print values into the build log.
          echo "EXPO_PUBLIC_MUSIC_PROXY_URL=$EXPO_PUBLIC_MUSIC_PROXY_URL" > $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SPOTIFY_CLIENT_ID=$EXPO_PUBLIC_SPOTIFY_CLIENT_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=$EXPO_PUBLIC_FIREBASE_API_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=$EXPO_PUBLIC_FIREBASE_PROJECT_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=$EXPO_PUBLIC_FIREBASE_APP_ID" >> $CM_BUILD_DIR/.env

      - name: Install dependencies
        script: npm install

      - name: Test JS bundle
        script: npx expo export --platform ios

      - name: Generate iOS project
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set up code signing
        script: xcode-project use-profiles --warn-only

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6763618643")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          # pipefail: without it, tee's exit code masks xcodebuild failures and
          # the build goes green with no IPA ("Skip publishing: no IPAs found")
          set -o pipefail
          # Sentry's Xcode phase fails the build when upload credentials are
          # missing — skip the upload (build still works, traces unsymbolicated)
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "SENTRY_AUTH_TOKEN/SENTRY_PROJECT not set — disabling source map upload"
            export SENTRY_DISABLE_AUTO_UPLOAD=true
          fi
          # A failed Sentry upload (network, quota) must never block a release;
          # it prints the error and continues with unsymbolicated traces.
          export SENTRY_ALLOW_FAILURE=true
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/SongMatch.xcworkspace" \
            --scheme "SongMatch" 2>&1 | tee /tmp/xcodebuild_full.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/xcodebuild_full.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
