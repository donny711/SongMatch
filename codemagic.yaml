workflows:
  ios-production:
    name: SongMatch iOS Production
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.songmatch.app
      node: v22
      xcode: latest
      cocoapods: default
      groups:
        - env_vars

    scripts:
      - name: Create .env file
        script: |
          echo "EXPO_PUBLIC_SPOTIFY_CLIENT_ID=$EXPO_PUBLIC_SPOTIFY_CLIENT_ID" > $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_AUDD_API_TOKEN=$EXPO_PUBLIC_AUDD_API_TOKEN" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_LASTFM_API_KEY=$EXPO_PUBLIC_LASTFM_API_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SOUNDCLOUD_CLIENT_ID=$EXPO_PUBLIC_SOUNDCLOUD_CLIENT_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SOUNDCLOUD_CLIENT_SECRET=$EXPO_PUBLIC_SOUNDCLOUD_CLIENT_SECRET" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=$EXPO_PUBLIC_FIREBASE_API_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=$EXPO_PUBLIC_FIREBASE_PROJECT_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=$EXPO_PUBLIC_FIREBASE_APP_ID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_ADMOB_REWARDED_IOS=$EXPO_PUBLIC_ADMOB_REWARDED_IOS" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS=$EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID=$EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_ADMOB_BANNER_IOS=$EXPO_PUBLIC_ADMOB_BANNER_IOS" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_ADMOB_BANNER_ANDROID=$EXPO_PUBLIC_ADMOB_BANNER_ANDROID" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_REVENUECAT_IOS_KEY=$EXPO_PUBLIC_REVENUECAT_IOS_KEY" >> $CM_BUILD_DIR/.env
          echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY" >> $CM_BUILD_DIR/.env
          cat $CM_BUILD_DIR/.env

      - name: Install dependencies
        script: npm install

      - name: Test JS bundle
        script: |
          npx react-native bundle             --platform ios             --dev false             --entry-file node_modules/expo-router/entry.js             --bundle-output /tmp/test-bundle.jsbundle             --assets-dest /tmp/test-assets

      - name: Generate iOS project
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set up code signing
        script: xcode-project use-profiles --warn-only

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6763618643")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa             --workspace "$CM_BUILD_DIR/ios/SongMatch.xcworkspace"             --scheme "SongMatch"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
